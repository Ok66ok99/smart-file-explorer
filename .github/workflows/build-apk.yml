
name: Build Smart File Explorer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          unzip -o smart_file_explorer_source.zip
          test -f smart_file_explorer/pubspec.yaml
          test -f smart_file_explorer/lib/main.dart

      - name: Create Android project
        working-directory: smart_file_explorer
        run: |
          flutter create --platforms=android --project-name smart_file_explorer .

      - name: Install dependencies
        working-directory: smart_file_explorer
        run: flutter pub get

      - name: Build release APK
        working-directory: smart_file_explorer
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-File-Explorer-APK
          path: smart_file_explorer/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
