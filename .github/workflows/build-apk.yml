name: Build Smart File Explorer APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
      - name: Extract project
        run: |
          unzip -o smart_file_explorer_source.zip
          test -f smart_file_explorer/pubspec.yaml
          test -f smart_file_explorer/lib/main.dart
      - name: Create Android scaffold
        working-directory: smart_file_explorer
        run: flutter create --platforms=android --project-name smart_file_explorer .
      - name: Set app compileSdk 36
        working-directory: smart_file_explorer
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import re
          candidates=[Path('android/app/build.gradle.kts'),Path('android/app/build.gradle')]
          for p in candidates:
              if not p.exists(): continue
              s=p.read_text()
              s,n=re.subn(r'(?m)^(\s*)compileSdk\s*=\s*flutter\.compileSdkVersion\s*$',r'\g<1>compileSdk = 36',s)
              if not n: s,n=re.subn(r'(?m)^(\s*)compileSdkVersion\s+flutter\.compileSdkVersion\s*$',r'\g<1>compileSdkVersion 36',s)
              if not n: s,n=re.subn(r'(?m)^(\s*)compileSdk\s*=\s*\d+\s*$',r'\g<1>compileSdk = 36',s)
              if not n: s,n=re.subn(r'(?m)^(\s*)compileSdkVersion\s+\d+\s*$',r'\g<1>compileSdkVersion 36',s)
              if not n: raise SystemExit(f'Could not set compileSdk in {p}')
              p.write_text(s)
              print(f'Updated {p}')
              break
          else: raise SystemExit('Android app Gradle file missing')
          PYFIX
      - name: Install dependencies
        working-directory: smart_file_explorer
        run: flutter pub get
      - name: Fix file_picker Android compileSdk
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import re,os
          cache=Path(os.environ['HOME'])/'.pub-cache'/'hosted'/'pub.dev'
          matches=list(cache.glob('file_picker-*/android/build.gradle'))+list(cache.glob('file_picker-*/android/build.gradle.kts'))
          if not matches: raise SystemExit('file_picker Android Gradle file not found')
          for p in matches:
              s=p.read_text()
              patterns=[(r'(?m)^(\s*)compileSdkVersion\s+\d+\s*$',r'\g<1>compileSdkVersion 36'),(r'(?m)^(\s*)compileSdk\s*=\s*\d+\s*$',r'\g<1>compileSdk = 36'),(r'(?m)^(\s*)compileSdkVersion\s*\(\s*\d+\s*\)',r'\g<1>compileSdkVersion(36)')]
              changed=False
              for pattern,replacement in patterns:
                  s,n=re.subn(pattern,replacement,s)
                  if n: changed=True; break
              if not changed: raise SystemExit(f'Unknown compileSdk syntax in {p}')
              p.write_text(s)
              print(f'Patched {p}')
          PYFIX
      - name: Build release APK
        working-directory: smart_file_explorer
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-file-explorer-apk
          path: smart_file_explorer/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
