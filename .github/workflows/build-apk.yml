
name: Build Smart File Explorer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" || true

      - name: Extract project
        run: |
          unzip -o smart_file_explorer_source.zip
          test -f smart_file_explorer/pubspec.yaml
          test -f smart_file_explorer/lib/main.dart

      - name: Create Android project
        working-directory: smart_file_explorer
        run: |
          flutter create --platforms=android --project-name smart_file_explorer .

      - name: Set compileSdk to 36
        working-directory: smart_file_explorer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = re.sub(
                  r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                  'compileSdk = 36', s
              )
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              s = re.sub(
                  r'compileSdkVersion\s+flutter\.compileSdkVersion',
                  'compileSdkVersion 36', s
              )
          p.write_text(s)
          print("Updated:", p)
          PY

      - name: Install dependencies
        working-directory: smart_file_explorer
        run: flutter pub get

      - name: Build release APK
        working-directory: smart_file_explorer
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-File-Explorer-APK
          path: smart_file_explorer/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
